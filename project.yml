name: Botcamp
options:
  bundleIdPrefix: com.pak209
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BotcampCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set Dan's team ID in Xcode (Signing & Capabilities)
targets:
  Botcamp:
    type: application
    platform: iOS
    sources:
      - path: Botcamp
    dependencies:
      - package: BotcampCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pak209.botcamp
        PRODUCT_NAME: Botcamp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Botcamp/Info.plist
      properties:
        CFBundleDisplayName: Botcamp
        UILaunchScreen: {}
        LSApplicationQueriesSchemes: [grok, chatgpt, claude]
        ITSAppUsesNonExemptEncryption: false
  BotcampCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BotcampCoreTests
    dependencies:
      - target: Botcamp
      - package: BotcampCore
schemes:
  Botcamp:
    build:
      targets:
        Botcamp: all
    run:
      config: Debug
      storeKitConfiguration: Botcamp/Botcamp.storekit
    test:
      targets: [BotcampCoreTests]
